; M5StickS3 merged launcher firmware.
; Build:  pio run
; Flash:  pio run -t upload
; Logs:   pio device monitor -b 115200
;
; Board is a brand-new (Jan 2026) ESP32-S3-PICO-1-N8R8: 8MB quad flash + 8MB
; OCTAL PSRAM. That octal PSRAM is why memory_type is qio_opi -- get this wrong
; and PSRAM never inits, the framebuffer alloc fails and the screen stays dark.
; pioarduino gives arduino-esp32 3.x, which is what actually knows this SiP.

[env:sticks3]
; 55.03.311 = arduino-esp32 3.3.11. Anything < 3.2.0 hits the I2S mic bug
; "gdma: user context not in internal RAM" -- the i2s channel handle lands in
; PSRAM and GDMA rejects the callback context. Fixed in core 3.2.0+.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_type = release

board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

lib_ldf_mode = deep
lib_deps =
	m5stack/M5Unified@^0.2.7
	kosme/arduinoFFT@^2.0.2
	crankyoldgit/IRremoteESP8266@^2.8.6
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.2.0
	h2zero/NimBLE-Arduino@^2.1.0
